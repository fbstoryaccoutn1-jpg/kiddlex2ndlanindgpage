<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landing Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e2e8f0;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:40px auto;padding:20px}
.card{background:#111827;border:1px solid #273449;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 15px 40px #0003}
h1{margin:0 0 8px}p{color:#94a3b8}input,button{font:inherit;border-radius:10px;border:1px solid #334155;padding:11px 12px}
input{background:#0b1220;color:#fff;width:100%}button{background:#2563eb;color:#fff;border:0;cursor:pointer;font-weight:700}
.row{display:grid;grid-template-columns:120px 1fr 140px 100px;gap:10px;align-items:center;margin:10px 0}.slug{font-weight:700}.msg{min-height:22px;color:#86efac}.error{color:#fca5a5}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.newbox{display:none;margin:18px 0;padding:16px;border:1px solid #334155;border-radius:14px;background:#0b1220}.newgrid{display:grid;grid-template-columns:160px 1fr 130px auto;gap:10px;align-items:end}
.small{font-size:12px;color:#94a3b8;margin-top:4px}#panel{display:none}@media(max-width:760px){.row,.newgrid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.wrap{margin:10px auto;padding:12px}}
</style>
</head>
<body><div class="wrap">
<div class="card" id="loginBox"><h1>Landing Admin</h1><p>Login to edit destination links and redirect delay.</p><input id="password" type="password" placeholder="Admin password"><br><br><button onclick="login()">Login</button><div id="loginMsg" class="msg"></div></div>
<div id="panel"><div class="card"><div class="head"><div><h1>Landing Pages</h1><p>Shared images and landing presentation stay unchanged. Changes save instantly.</p></div><button onclick="showNew()">+ New Link</button></div><div id="newBox" class="newbox"><div class="newgrid"><div><div class="small">Slug</div><input id="newSlug" placeholder="new-link"></div><div><div class="small">Destination URL</div><input id="newDestination" placeholder="https://example.com/..."></div><div><div class="small">Delay (seconds)</div><input id="newDelay" type="number" min="0" max="60" step="0.1" value="3"></div><button onclick="createNew()">Create</button></div><div class="small" style="margin-top:10px">New links automatically use the same /assets/1.webp to /assets/18.webp landing images.</div></div><div id="rows"></div><div id="msg" class="msg"></div></div></div>
</div>
<script>
async function login(){
 const password=document.getElementById("password").value;
 const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password})});
 if(!r.ok){document.getElementById("loginMsg").textContent="Wrong password";document.getElementById("loginMsg").className="msg error";return}
 load();
}
async function load(){
 const r=await fetch("/api/config");
 if(!r.ok)return;
 const d=await r.json();document.getElementById("loginBox").style.display="none";document.getElementById("panel").style.display="block";
 document.getElementById("rows").innerHTML=d.rows.map(x=>`<div class="row"><div class="slug">/${x.slug}</div><input id="u-${x.slug}" value="${esc(x.destination)}"><div><input id="d-${x.slug}" type="number" min="0" max="60" step="0.1" value="${Number(x.delay||3000)/1000}"><div class="small">seconds</div></div><button onclick="save('${x.slug}')">Save</button></div>`).join("");
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}\nfunction cleanSlug(s){return String(s||"").toLowerCase().trim().replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80)}\nfunction showNew(){const b=document.getElementById("newBox");b.style.display=b.style.display==="block"?"none":"block";if(b.style.display==="block")document.getElementById("newSlug").focus()}\nasync function createNew(){const slug=cleanSlug(document.getElementById("newSlug").value);const destination=document.getElementById("newDestination").value.trim();const seconds=Number(document.getElementById("newDelay").value);const m=document.getElementById("msg");if(!slug){m.textContent="Slug is required";m.className="msg error";return}if(!/^https?:\\/\\//i.test(destination)){m.textContent="Enter a valid destination URL";m.className="msg error";return}if(!Number.isFinite(seconds)||seconds<0||seconds>60){m.textContent="Delay must be between 0 and 60 seconds";m.className="msg error";return}m.textContent="Creating...";m.className="msg";const r=await fetch("/api/config",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"upsert",slug,originalSlug:slug,destination,delay:Math.round(seconds*1000),isNew:true})});const d=await r.json().catch(()=>({}));if(!r.ok){m.textContent=d.error||"Create failed";m.className="msg error";return}document.getElementById("newBox").style.display="none";document.getElementById("newSlug").value="";document.getElementById("newDestination").value="";document.getElementById("newDelay").value="3";m.textContent="/"+slug+" created ✓";m.className="msg";await load()}
async function save(slug){
 const destination=document.getElementById("u-"+slug).value;
 const seconds=Number(document.getElementById("d-"+slug).value);
 const delay=Math.round(seconds*1000);
 const r=await fetch("/api/config",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({slug,destination,delay})});
 const d=await r.json();const m=document.getElementById("msg");m.textContent=d.ok?`/${slug} saved ✓`:(d.error||"Save failed");m.className=d.ok?"msg":"msg error";
}
load();
</script>
</body></html>
